<template mode="closed">
  <div class="box">
    <slot>empty box 2</slot>
  </div>
</template>

<script>
  class Box2 extends HTMLElement {
    constructor() {
      // Always call super first in constructor (?)
      super();

      this.addEventListener('click', () => console.log('box-2 Clicked!'));
    }
    // Element functionality written in here
  }

  customElements.define("box-2", Box2);

  const shadowRoot = this.attachShadow({ mode: "closed" });
  let template = document.getElementById("box-2").content;
  shadowRoot.appendChild(template.cloneNode(true));

</script>

<style>
  .box {
    background-color: #fdffb6;
    /* pastel yellow */
    color: #555555;
    font-weight: 800;
    padding: 1.5rem;
    border-radius: 8px;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
</style>
