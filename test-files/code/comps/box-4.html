<template mode="closed">
  <div class="box">
    <slot></slot>
  </div>
</template>

<script>

  class Box4 extends HTMLElement {
    constructor() {
      // Always call super first in constructor (?)
      super();

      this.addEventListener('click', () => console.log('box-4 Clicked!'));
    }
    // Element functionality written in here
  }

  customElements.define("box-4", Box4);

  const shadowRoot = this.attachShadow({ mode: "closed" });
  let template = document.getElementById("box-4").content;
  shadowRoot.appendChild(template.cloneNode(true));

</script>

<style>
  .box {
    background-color: #ffc6ff;
    /* pastel pink */
    color: #333333;
    font-weight: 800;
    padding: 0.5rem;
    border-radius: 4px;
    margin-top: 0.5rem;
    display: inline-block;
  }
</style>
