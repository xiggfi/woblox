<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes Grid</title>
    <style>
        body {
            background-color: #0b1a2a; /* dark-blue background */
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-text {
            font-size: 1.5rem;
            font-weight: 900; /* fat text */
            margin-bottom: 2rem;
            color: #fbd38d; /* pastel orange fat text */
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>

<body>
    <div class="header-text">A simple arrangement of colored boxes (grid)</div>
    <div class="grid-container">
        <box-1> top left, blue</box-1>
        <box-2 />
        <box-3>center, orange</box-3>
        <box-1>Duplicate, blue</box-1>
        <box-3>
            Bottom, green
            <box-4>Nested, pink</box-4>
        </box-3>
    </div>
</body>

</html>
