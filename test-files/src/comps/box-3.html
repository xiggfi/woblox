<template mode="closed">
  <div class="box">
    <slot></slot>
  </div>
</template>

<script>

  class Box3 extends HTMLElement {
    constructor() {
      // Always call super first in constructor (?)
      super();

      this.addEventListener('click', () => console.log('box-3 Clicked!'));
    }
    // Element functionality written in here
  }

  customElements.define("box-3", Box3);

  const shadowRoot = this.attachShadow({ mode: "closed" });
  let template = document.getElementById("box-3").content;
  shadowRoot.appendChild(template.cloneNode(true));

</script>

    background-color: #caffbf;
